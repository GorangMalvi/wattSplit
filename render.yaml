# Render blueprint for wattSplit (render.com -> New -> Blueprint).
# Secrets are "sync: false": Render asks for them on first deploy and never
# reads them from this file.
services:
  # Backend API
  - type: web
    name: wattsplit-api
    runtime: docker
    plan: free
    region: singapore          # same region as the Supabase project
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: SUPABASE_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: MAILTRAP_API_TOKEN
        sync: false
      - key: MAIL_FROM_EMAIL
        value: wattsplit@jugadu.tech   # must be on a domain verified in Mailtrap
      - key: MAIL_FROM_NAME
        value: wattSplit
      # Public web app: used in roommate invite links, and allowed to call the API.
      - key: APP_URL
        value: https://wattsplit.jugadu.tech
      - key: CORS_ORIGINS
        value: https://wattsplit.jugadu.tech

  # Web app (static React build), served at https://wattsplit.jugadu.tech
  - type: web
    name: wattsplit-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: true
    domains:
      - wattsplit.jugadu.tech
    routes:
      # Single-page app: every path (e.g. /?invite=CODE) serves index.html.
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: VITE_API_URL
        value: https://wattsplit-api.onrender.com/api
      # Public values (they ship in the browser bundle anyway).
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
