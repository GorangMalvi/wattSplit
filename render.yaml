# Render blueprint for the wattSplit backend (render.com -> New -> Blueprint).
# Secrets are "sync: false": Render asks for them on first deploy and never
# reads them from this file.
services:
  - type: web
    name: wattsplit-api
    runtime: docker
    plan: free
    region: singapore          # same region as the Supabase project
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: SUPABASE_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: MAILTRAP_API_TOKEN
        sync: false
      - key: MAIL_FROM_EMAIL
        sync: false
      - key: MAIL_FROM_NAME
        value: wattSplit
