services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: electricity-backend
    ports:
      # This PC only: the dev sign-in (below) must not be reachable from the network.
      - "127.0.0.1:8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      # Supabase settings come from .env (see .env.example)
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_JWT_SECRET=${SUPABASE_JWT_SECRET:-}
      - DATABASE_URL=${DATABASE_URL}
      - MAILTRAP_API_TOKEN=${MAILTRAP_API_TOKEN:-}
      - MAIL_FROM_EMAIL=${MAIL_FROM_EMAIL:-}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME:-wattSplit}
      # Public web address for roommate invite links (default: the page the owner uses)
      - APP_URL=${APP_URL:-}
      # Voice payments (60db speech-to-text); empty hides the mic button
      - SIXTYDB_API_KEY=${SIXTYDB_API_KEY:-}
      # Local dev sign-in with code 123456 (see backend/app/dev_login.py)
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-}
      - DEV_LOGIN_EMAILS=${DEV_LOGIN_EMAILS:-}
    networks:
      - electricity-net
    restart: unless-stopped
    healthcheck:
      # python:3.11-slim has no curl, so probe with Python itself
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Route API calls through nginx's /api proxy (same origin, no CORS)
        VITE_API_URL: /api
        # Public Supabase values baked into the browser bundle
        VITE_SUPABASE_URL: ${SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
    container_name: electricity-frontend
    ports:
      # LOCAL_HOST_URL from .env (http://wattsplit.localhost)
      - "${LOCAL_HOST_PORT:-80}:80"
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - electricity-net
    restart: unless-stopped
    healthcheck:
      # nginx:alpine ships busybox wget
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

networks:
  electricity-net:
    driver: bridge
